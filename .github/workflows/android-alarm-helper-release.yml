name: Android Alarm Helper Release

on:
  push:
    tags:
      - "alarm-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure SDK path for Gradle
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android-alarm-helper/local.properties

      - name: Build debug APK
        working-directory: android-alarm-helper
        run: ./gradlew assembleDebug

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-alarm-helper/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/alarm-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-alarm-helper/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
